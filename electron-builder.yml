appId: com.Geocld.PeaSyo4Desk
productName: PeaSyo4Desk
copyright: Copyright © 2026 Geocld

directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - app
      - peasyo-lib
asarUnpack:
  - node_modules/peasyo-sdl-lib/**/*
  - peasyo-lib/**/*.node
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: node_modules/@ffmpeg-installer
    to: ffmpeg-installer
    filter:
      - "*/ffmpeg"
      - "*/ffmpeg.exe"
publish:
- github


# Mac OS configuration
mac:
  category: public.app-category.games
  icon: resources/icon.icns
  mergeASARs: false
  extendInfo:
    NSLocalNetworkUsageDescription: PeaSyo4Desk needs access to your local network to discover consoles and connect to them.
    NSMicrophoneUsageDescription: PeaSyo4Desk needs microphone access to send your voice to the console during Remote Play.
  x64ArchFiles: "{Contents/Resources/ffmpeg-installer/**/*,Contents/Resources/app.asar.unpacked/node_modules/peasyo-sdl-lib/**/*}"
  target: 
  - target: dmg
    arch: 
    - universal

# Config for OSX dmg
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: "link"
      path: "/Applications"

# Windows configuration
win:
  icon: resources/icon.ico
  signAndEditExecutable: true
  target:
    - "zip"
    - "nsis"

# Config for the windows installer
nsis:
  oneClick: true
  perMachine: true

# Linux configuration
linux:
  category: Game
  icon: resources/PeaSyo.png
  target:
    - "AppImage"
    - "deb"
