appId: com.Geocld.PeaSyo4Desk
productName: PeaSyo4Desk
copyright: Copyright © 2026 Geocld

directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - app
extraResources:
  - from: main/chiaki
    to: chiaki
    filter:
      - chiaki-lib*.node
publish:
- github


# Mac OS configuration
mac:
  category: public.app-category.games
  icon: resources/icon.icns
  x64ArchFiles: "Contents/Resources/chiaki/*.node"
  target: 
  - target: dmg
    arch: 
    - universal

# Config for OSX dmg
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: "link"
      path: "/Applications"

# Windows configuration
win:
  icon: resources/icon.ico
  target:
    - "zip"
    - "nsis"

# Config for the windows installer
nsis:
  oneClick: true
  perMachine: true

# Linux configuration
linux:
  category: Game
  icon: resources/PeaSyo.png
  target:
    - "AppImage"
    - "deb"
